# Stonks production stack (Phase 14.2).
#
#   internet / tailnet --443--> caddy --8000--> api (REST + console)
#                                               scheduler (python -m stonks.scheduling run)
#                               api + scheduler share the one `data` volume (/data)
#
# Run from this directory:  docker compose up -d
# Secrets and settings come from ./.env (copy .env.example; chmod 600).
# Backups:                  docker compose --profile backup run --rm restic snapshots

name: stonks

x-app: &app
  image: ${STONKS_IMAGE:-ghcr.io/OWNER/stonks}:${STONKS_IMAGE_TAG:-latest}
  env_file:
    - path: .env
      required: false
  environment:
    STONKS_DATA_DIR: /data
  volumes:
    - data:/data
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  api:
    <<: *app
    command: ["stonks", "serve", "--host", "0.0.0.0", "--port", "8000"]
    # The anchor's environment is replaced, not merged: repeat STONKS_DATA_DIR.
    # Caddy's X-Forwarded-For is believed only from this network, so the
    # login limit and the audit log see each visitor's real IP. Port 8000 is
    # not published, so nothing outside the network can reach the API.
    environment:
      STONKS_DATA_DIR: /data
      STONKS_API_TRUSTED_PROXIES: ${STONKS_DOCKER_SUBNET:-172.31.250.0/24}
    expose:
      - "8000"
    # A running tick or ingest is never cut off mid-way. Give it time to
    # finish on shutdown instead of Docker's default 10 s.
    stop_grace_period: 5m
    # Readiness (state migrated, lake present), so Caddy and the scheduler
    # start only once the API can serve. The image's own check is liveness.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4)
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  scheduler:
    <<: *app
    command: ["python", "-m", "stonks.scheduling", "run"]
    # The anchor's environment is replaced, not merged: repeat STONKS_DATA_DIR.
    # Jobs run inside the api (it holds the lake); the token may travel over
    # plain http only to the api service on the private Compose network.
    environment:
      STONKS_DATA_DIR: /data
      STONKS_API_URL: http://api:8000
      STONKS_API_TRUSTED_HOSTS: api
    # Let a running job's wait finish (or time out cleanly) on shutdown.
    stop_grace_period: 2m
    # On when COMPOSE_PROFILES includes "scheduler" (deploy/.env).
    profiles: ["scheduler"]
    depends_on:
      api:
        condition: service_healthy
    # No HTTP server here; the image healthcheck would always fail.
    healthcheck:
      disable: true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${STONKS_BIND_IP:-0.0.0.0}:80:80"
      - "${STONKS_BIND_IP:-0.0.0.0}:443:443"
      - "${STONKS_BIND_IP:-0.0.0.0}:443:443/udp"
    environment:
      STONKS_DOMAIN: ${STONKS_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # One-shot backup tool, not started by `up`. See deploy/backup/.
  restic:
    image: restic/restic:0.18.0
    profiles: ["backup"]
    env_file:
      - path: .env
        required: false
    environment:
      RESTIC_CACHE_DIR: /cache
    volumes:
      - data:/data:ro
      - restic_cache:/cache
      - restore:/restore
    logging: *logging

networks:
  default:
    # A fixed subnet, so the API can trust exactly this range as its proxy.
    # Change STONKS_DOCKER_SUBNET in .env if it clashes with a host network.
    ipam:
      config:
        - subnet: ${STONKS_DOCKER_SUBNET:-172.31.250.0/24}

volumes:
  # All Stonks state: lake.duckdb, Parquet bars, state.sqlite, artifacts,
  # backups. Bound to a host path so it can sit on an attached block volume.
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STONKS_DATA_PATH:-/srv/stonks/data}
  caddy_data:
  caddy_config:
  restic_cache:
  # Scratch target for restore tests; wiped by restore-test.sh.
  restore:
