name: Mutation

# TT-04: mutation testing of the money paths (orders, fills, risk rules,
# the ledger sync and P&L) with cosmic-ray. Slow, so weekly and on demand,
# never per PR. The gate is a surviving-mutant rate under 10 percent; the
# job fails above it. Targets live in tools/mutation.py.

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated targets (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Mutation testing
        env:
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          uv run --with cosmic-ray python -m tools.mutation "${args[@]}"
      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-summary
          path: mutation-summary.json
          if-no-files-found: ignore
