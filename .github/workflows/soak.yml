name: Soak

# The long paper soak (roadmap 12.10, docs/testing.md): a quarter of
# simulated trading days through the scheduler, ingest, ticks, health and
# backups, with crashes mid-tick, restarts, a kill switch and a DST switch.
# Weekly and by hand. The short smoke version runs in the default suite.

on:
  schedule:
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC
  workflow_dispatch:

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked

      - name: Run the soak
        run: uv run pytest -m soak tests/soak -q -rA -s 2>&1 | grep -v '^{' | tee soak.log; exit "${PIPESTATUS[0]}"

      - name: Upload the soak log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-log
          path: soak.log
          retention-days: 14
