name: Release

# On a version tag (v1.2.3): check the version, build and push a multi-arch
# image to GHCR with provenance and an SBOM, then publish a GitHub release
# with the changelog for that tag (Phases 12.9, 14.4). The Deploy workflow
# picks it up when this run succeeds.
#
#   git tag v1.2.3 ──> verify ──> image (amd64 + arm64, GHCR) ──> GitHub release
#                                                                  └─> Deploy

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A release deploys itself, so it must be code that went through a
      # reviewed pull request and CI on the protected main branch.
      - name: Tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main. Merge first, then tag on main."
            exit 1
          fi
      - name: Tag matches pyproject.toml version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::Tag ${tag} does not match pyproject.toml version ${version}. Bump the version, commit, then tag."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ needs.verify.outputs.image }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.verify.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changelog section for this version
        id: notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # The hand-written section "## [<version>]" of CHANGELOG.md, up to
          # the next "## [" heading. None: fall back to the git-cliff list.
          awk -v v="## [${VERSION}]" '
            index($0, v) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Changelog for this tag (git-cliff fallback)
        if: steps.notes.outputs.found != 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Add image reference
        run: |
          {
            echo
            echo "### Image"
            echo
            echo '```'
            echo "docker pull ${{ needs.verify.outputs.image }}:${GITHUB_REF_NAME}"
            echo '```'
          } >> RELEASE_NOTES.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
