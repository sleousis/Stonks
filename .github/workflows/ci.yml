name: CI

on:
  push:
    branches: [main]
  pull_request:

# TT-13 (BE-48): read-only token, and every job has a time limit.
permissions:
  contents: read

jobs:
  # The Python suite runs in parallel shards. tools/ci_shards.py splits the
  # test modules by file, deterministically, and every module lands in
  # exactly one shard. Keep the shard lists below and CI_SHARDS in step.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      # TT-02: pyright basic over src/stonks; fails only on errors that are
      # not in tools/pyright-baseline.json. The strict packages in
      # [tool.pyright] (core, execution) may have no errors at all (BL-49).
      - name: Type check (new pyright errors only)
        run: uv run python -m tools.pyright_gate

  test-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI_SHARDS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      # Each shard writes raw coverage data only. The per-shard total is
      # partial, so fail_under waits for the combined report in "test".
      - name: Test shard ${{ matrix.shard }} with coverage
        run: |
          mapfile -t files < <(uv run python -m tools.ci_shards "${{ matrix.shard }}" "$CI_SHARDS")
          [ "${#files[@]}" -gt 0 ]
          echo "shard ${{ matrix.shard }} of $CI_SHARDS: ${#files[@]} test modules"
          uv run pytest -q -n auto --cov --cov-report= --cov-fail-under=0 "${files[@]}"
          mv .coverage "coverage-${{ matrix.shard }}.data"
      - name: Upload the shard's coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.data
          if-no-files-found: error
          retention-days: 1

  # The required check. It fails when lint or any shard fails, then merges
  # the shards' coverage and runs the gates on the whole suite.
  test:
    if: always()
    needs: [lint, test-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lint and every shard passed
        env:
          LINT: ${{ needs.lint.result }}
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          echo "lint: $LINT, shards: $SHARDS"
          [ "$LINT" = success ] && [ "$SHARDS" = success ]
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: shards
          merge-multiple: true
      # TT-01: coverage.py's combined line-and-branch number. fail_under
      # (pyproject.toml) holds the overall gate of 90; tools/coverage_gate.py
      # holds the per-package floors for core, production, execution, auth
      # and portfolio (target 95, floors at today's value where lower).
      - name: Combine the shards' coverage
        run: |
          uv run coverage combine shards/*.data
          uv run coverage json -o coverage.json --fail-under=0
          uv run coverage report
      - name: Coverage floors per package
        run: uv run python -m tools.coverage_gate coverage.json
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.json
          if-no-files-found: ignore

  # TT-12 (BE-48): pyproject says Python 3.12+, so the oldest supported
  # version runs the whole suite too (no coverage, "test" has it), in the
  # same shards.
  test-python-3-12-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI_SHARDS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Test shard ${{ matrix.shard }}
        run: |
          mapfile -t files < <(uv run --python 3.12 python -m tools.ci_shards "${{ matrix.shard }}" "$CI_SHARDS")
          [ "${#files[@]}" -gt 0 ]
          uv run --python 3.12 pytest -q -n auto "${files[@]}"

  test-python-3-12:
    if: always()
    needs: [test-python-3-12-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.test-python-3-12-shard.result }}
        run: |
          echo "shards: $SHARDS"
          [ "$SHARDS" = success ]

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generated API client is up to date
        run: npm run api:check
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      # Vitest coverage through the Angular unit-test builder. The v8
      # provider is installed for this run only, at vitest's own version, so
      # web/package.json is unchanged. Report only, no threshold yet
      # (measured 2026-09-26: 87.4 lines, 76.6 branches).
      - name: Test with coverage
        run: |
          npm install --no-save --no-audit --no-fund "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")"
          npx ng test --watch=false --coverage --coverage-reporters=text-summary --coverage-reporters=lcov
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore
      - name: Build
        run: npm run build

  # ---- Security (Phase 12.8) ------------------------------------------------
  audit-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Export the locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt
      - name: pip-audit (accepted findings in .github/audit/pip-audit-ignore.txt)
        run: |
          ignores=()
          while read -r id _; do
            case "$id" in ''|'#'*) continue ;; esac
            ignores+=(--ignore-vuln "$id")
          done < .github/audit/pip-audit-ignore.txt
          uvx pip-audit --disable-pip --require-hashes -r requirements-audit.txt "${ignores[@]}"

  audit-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm audit --omit=dev (allowlist in .github/audit/npm-audit-allowlist.json)
        run: node ../.github/audit/npm-audit.mjs --level=moderate

  # ---- Packaging and deploy files (Phases 12.7, 14) ---------------------------
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: stonks:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name stonks-ci -e STONKS_API_TOKEN=ci stonks:ci
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' stonks-ci)"
            [ "$status" = healthy ] && break
            sleep 3
          done
          docker logs stonks-ci | tail -n 20
          [ "$status" = healthy ]
          docker run --rm stonks:ci stonks db init  # own container: serve holds the lake (one writer)
          docker exec stonks-ci test -f /app/web/dist/index.html
          docker exec stonks-ci sh -c 'test "$(id -u)" = 10001'

  deploy-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Compose file is valid
        working-directory: deploy
        run: |
          cp .env.example .env
          # Placeholder IBKR secret files, so the gateway profiles resolve.
          mkdir -p ibkr/secrets
          touch ibkr/secrets/{paper,live}_{username,password}.txt
          docker compose config --quiet
          for profile in scheduler lab-worker backup ibkr-paper ibkr-live ai; do
            echo "profile $profile"
            docker compose --profile "$profile" config --quiet
          done
          COMPOSE_PROFILES=scheduler,lab-worker,backup,ibkr-paper,ibkr-live,ai \
            docker compose -f compose.yaml -f compose.tailscale.yaml config --quiet
      - name: Shell scripts pass shellcheck
        run: shellcheck -x deploy/scripts/*.sh deploy/backup/*.sh deploy/monitor/*.sh
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Terraform fmt and validate
        working-directory: infra/terraform/hetzner
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
