name: CI

on:
  push:
    branches: [main]
  pull_request:

# TT-13 (BE-48): read-only token, and every job has a time limit.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      # TT-02: pyright basic over src/stonks; fails only on errors that are
      # not in tools/pyright-baseline.json. The strict packages in
      # [tool.pyright] (core, execution) may have no errors at all (BL-49).
      - name: Type check (new pyright errors only)
        run: uv run python -m tools.pyright_gate
      # TT-01: coverage.py's combined line-and-branch number. fail_under
      # (pyproject.toml) holds the overall gate of 90; tools/coverage_gate.py
      # holds the per-package floors for core, production, execution, auth
      # and portfolio (target 95, floors at today's value where lower).
      - name: Test with coverage
        run: uv run pytest -q -n auto --cov --cov-report=json --cov-report=term
      - name: Coverage floors per package
        run: uv run python -m tools.coverage_gate coverage.json
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.json
          if-no-files-found: ignore

  # TT-12 (BE-48): pyproject says Python 3.12+, so the oldest supported
  # version runs the whole suite too (no coverage, the job above has it).
  test-python-3-12:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Test
        run: uv run --python 3.12 pytest -q -n auto

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generated API client is up to date
        run: npm run api:check
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      # Vitest coverage through the Angular unit-test builder. The v8
      # provider is installed for this run only, at vitest's own version, so
      # web/package.json is unchanged. Report only, no threshold yet
      # (measured 2026-09-26: 87.4 lines, 76.6 branches).
      - name: Test with coverage
        run: |
          npm install --no-save --no-audit --no-fund "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")"
          npx ng test --watch=false --coverage --coverage-reporters=text-summary --coverage-reporters=lcov
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore
      - name: Build
        run: npm run build

  # ---- Security (Phase 12.8) ------------------------------------------------
  audit-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Export the locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt
      - name: pip-audit (accepted findings in .github/audit/pip-audit-ignore.txt)
        run: |
          ignores=()
          while read -r id _; do
            case "$id" in ''|'#'*) continue ;; esac
            ignores+=(--ignore-vuln "$id")
          done < .github/audit/pip-audit-ignore.txt
          uvx pip-audit --disable-pip --require-hashes -r requirements-audit.txt "${ignores[@]}"

  audit-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit --omit=dev (allowlist in .github/audit/npm-audit-allowlist.json)
        run: node ../.github/audit/npm-audit.mjs --level=moderate

  # ---- Packaging and deploy files (Phases 12.7, 14) ---------------------------
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: stonks:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name stonks-ci -e STONKS_API_TOKEN=ci stonks:ci
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' stonks-ci)"
            [ "$status" = healthy ] && break
            sleep 3
          done
          docker logs stonks-ci | tail -n 20
          [ "$status" = healthy ]
          docker run --rm stonks:ci stonks db init  # own container: serve holds the lake (one writer)
          docker exec stonks-ci test -f /app/web/dist/index.html
          docker exec stonks-ci sh -c 'test "$(id -u)" = 10001'

  deploy-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        working-directory: deploy
        run: |
          cp .env.example .env
          # Placeholder IBKR secret files, so the gateway profiles resolve.
          mkdir -p ibkr/secrets
          touch ibkr/secrets/{paper,live}_{username,password}.txt
          docker compose config --quiet
          for profile in scheduler lab-worker backup ibkr-paper ibkr-live ai; do
            echo "profile $profile"
            docker compose --profile "$profile" config --quiet
          done
          COMPOSE_PROFILES=scheduler,lab-worker,backup,ibkr-paper,ibkr-live,ai \
            docker compose -f compose.yaml -f compose.tailscale.yaml config --quiet
      - name: Shell scripts pass shellcheck
        run: shellcheck -x deploy/scripts/*.sh deploy/backup/*.sh deploy/monitor/*.sh
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: Terraform fmt and validate
        working-directory: infra/terraform/hetzner
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
