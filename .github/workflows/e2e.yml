name: E2E

# Browser journeys over a seeded stack (docs/testing.md). Not a required
# check yet: it runs on every pull request and push to main, and uploads the
# Playwright traces, the axe report and the server log when it fails.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the console
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked

      - name: Playwright version
        id: playwright
        run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium
      - name: Install Chromium system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium

      - name: Run the e2e suite (headless Chromium)
        run: uv run pytest -m e2e tests/e2e -q --browser chromium

      - name: Upload traces and reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 14
