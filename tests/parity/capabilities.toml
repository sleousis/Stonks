# Surface parity (roadmap 18.7): every capability and where it is reachable.
#
# One [[capability]] per thing a person can do. Each surface is one of:
#   "entry" or ["entry", ...]   present, and checked by tests/unit/test_surface_parity.py
#                               console: operationIds the hand-written console imports
#                               cli: "stonks <group> <command>" or "python -m stonks.<module> <sub>"
#                               mcp: MCP tool names
#   { limited = "why" }         left out on purpose, with the reason
#   { gap = "WP", note = "" }   a known gap. The count may only go down (see the test)
#
# Every OpenAPI operation sits in exactly one capability's `routes`, or in
# [infra_routes] with a reason.

schema_version = 1

[infra_routes]
"GET /api/health/live" = "liveness probe for the container healthcheck, no client"
"GET /api/health/ready" = "readiness probe Compose waits for, no client"

