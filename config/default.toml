[lake]
path = "data/lake.duckdb"

# Bar store: "duckdb" (table in the lake file) or "parquet" (partitioned
# files under <lake dir>/bars, readable while `stonks serve` runs). Switch with
# `uv run python -m stonks.store.bars_migrate` (see docs/architecture.md).
[lake.bars]
backend = "duckdb"

[state]
path = "data/state.sqlite"

[registry]
artifacts_dir = "data/artifacts"

[logging]
level = "INFO"

[production]
# Universe the production tick iterates: a ticker list, or the id of a stored
# universe (e.g. universe = "sp500") whose members on the tick's date are
# traded. Empty means "explicitly pass --tickers".
universe = []
threshold = 0.0
initial_cash = 10000.0
slippage_bps = 0.0
fee_per_trade = 0.0
# Ignore closes older than this many calendar days before the tick's as_of.
max_price_staleness_days = 7
# Evaluate shadow strategies each tick against their own virtual portfolios
# (written to shadow_decisions / shadow_portfolio_snapshots; never traded).
shadow_enabled = true
# Fraction of each cash dividend withheld as tax in the tick and shadow
# books (0 = credited in full; e.g. 0.15 for a treaty withholding rate).
dividend_withholding_rate = 0.0
# Which strategies keep a model book each tick: "shadow" (shadow strategies
# only) or "all" non-retired strategies.
model_books = "shadow"
# How paper and model books fill (principle P21). "next_open": an order
# decided at the close stays working and fills at the next session's open
# through [backtest.execution] and [backtest.costs], as a backtest does. The
# next tick books it. "close": fill at once at the latest close (old).
paper_fills = "next_open"
# true: trade one book per portfolio from its paper/auto subscriptions (and
# record notify-mode signals). A promotion subscribes pf_default to the
# strategy, so the default book still trades every active strategy.
# false: the old single book over every active strategy, other books idle.
books_from_subscriptions = true

[production.construction]
# Portfolio constructor for every book (a portfolio's construction_json is
# merged on top): single_winner (default: the best-ranked strategy decides),
# equal_weight_top_n, inverse_vol, vol_target, atr_parity. The buffer applies
# to the target-weight constructors only.
method = "single_winner"
buffer_fraction = 0.10
min_trade_weight = 0.005

[production.risk]
# Risk layer between strategy.decide and the broker. Sells are never blocked.
# Weights are fractions of portfolio value before the tick's orders.
enabled = true
# max_open_positions = 10          # omit for unlimited
max_weight_per_ticker = 1.0
cash_buffer_fraction = 0.0
min_order_notional = 0.0

[production.risk.max_weight_per_asset_class]
# crypto = 0.2                     # classes not listed are uncapped

# History-aware risk rules (BL-27), all off by default. Portfolio and
# subscription overrides can only tighten them. Examples:
# [production.risk.rules.max_holding]
# max_holding_bars = 60            # force-sell positions held 60+ bars
# [production.risk.rules.sector_cap]
# max_weight_per_sector = 0.3
# look_through = true              # count a held fund's sectors too (23.14)
# [production.risk.rules.liquidity]
# max_pct_adv = 0.05               # buys up to 5% of 20-day average volume
# [production.risk.rules.portfolio_vol]
# vol_cap = 0.20                   # scale buys down above 20% forecast vol
# [production.risk.rules.risk_per_position]
# max_risk = 0.01                  # k * ATR risk per position, fraction of equity
# [production.risk.rules.drawdown_scaling]
# schedule = [[0.10, 0.5], [0.20, 0.0]]   # size by drawdown from peak
# [production.risk.rules.style_exposure]
# max_abs_exposure = 0.5           # net style lean in z-score units (roadmap 22.4)
# styles = ["momentum", "size", "value", "volatility"]

# Short-book rules (roadmap 16.2), all off by default. They matter only for
# a portfolio with allow_short. Examples:
# [production.risk.rules.margin_call]
# enabled = true                   # forced closes on a margin breach
# [production.risk.rules.gross_exposure]
# max_gross = 1.0                  # sum of |weights|
# [production.risk.rules.net_exposure]
# min_net = 0.0
# max_net = 1.0
# [production.risk.rules.short_caps]
# max_short_weight = 0.05          # per name
# max_short_total = 0.5
# [production.risk.rules.borrow_check]
# enabled = true
# max_borrow_fee = 0.10            # drop shorts costing more than 10 %/yr
# [production.risk.rules.squeeze_guard]
# max_borrow_fee = 0.10
# max_adverse_pct = 0.25           # cover 25 % above entry
# spike_pct = 0.30                 # cover after a 30 % rise in spike_bars bars

# Margin accounts at IBKR (roadmap 19.13), off by default: the first live
# account is a cash account, long only. To turn margin on, set these, the
# gateway's account_type = "margin", then pick Margin in Live settings.
# See docs/operations.md, "Margin accounts".
# [production.risk.rules.account_rules]
# enabled = true
# margin_accounts = true
# margin_buffer = 0.10             # the what-if margin leaves 10 % of equity unused
# [production.risk.rules.margin_call]
# enabled = true
# warn_cushion = 0.15              # alert below 15 % excess liquidity over equity
# reduce_cushion = 0.10            # sell own positions below 10 % ...
# restore_cushion = 0.20           # ... until the cushion is back at 20 %

# Circuit breaker (BL-28): halts new buys after a loss. Off until a limit is
# set. Recommended values below. A trip opens a risk_halts row the owner
# sees and clears (`stonks halts list`, `stonks halts clear ID --reason ...`).
[production.risk.rules.circuit_breaker]
# max_month_loss = 0.06            # loss from the month's first snapshot
# max_week_loss = 0.04             # loss over week_sessions snapshots
# max_drawdown_halt = 0.20         # drawdown from the peak, held until cleared
week_sessions = 5
cooldown = "rest_of_month"         # or "none": lift once the loss is made back

# Operational halt (BL-28): halts new buys when the newest bar is too old.
# `stonks health` also opens a global halt on stale data or a stuck run.
[production.risk.rules.operational_halt]
# max_bar_age_days = 5

[production.quit_rule]
# Quit rule (BL-29): after each tick, alert the admins when an active
# strategy's drawdown since promotion passes quit_multiple x its backtest
# drawdown (or the Monte Carlo p95 when tighter).
quit_multiple = 1.5
auto_demote = false                # true: also move it to shadow
min_eval_days = 126                # evaluation horizon before a retire needs no override

[production.risk_monitor]
# Live risk (BL-47): after each real tick, store each book's one-day VaR and
# ES and score yesterday's forecast. Alerts when the violation ratio leaves
# ratio_low..ratio_high after min_window scored days.
enabled = true
lam = 0.94                         # EWMA decay of the covariance
window = 250                       # daily returns behind a forecast
min_window = 60
ratio_low = 0.5
ratio_high = 1.5

[production.decisions]
# Why did or didn't we trade (roadmap 23.7): per tick, book and ticker, the
# step that kept a ticker out or trimmed it. Rows older than keep_days go.
enabled = true
keep_days = 120

[production.decay]
# Alpha decay per strategy sleeve: fires when the short-window IR stays
# negative for negative_days, or the long-window IR falls below
# min_fraction of the backtest IR.
short_window = 60
long_window = 120
negative_days = 20
min_fraction = 0.5

[production.feature_drift]
# Live feature drift of model strategies (roadmap 23.10): each real tick
# stores the rows a model scores and, once the last window_days days hold
# min_rows rows, compares them with the training profile stored with the
# model (PSI per feature). Warn only: nothing is blocked.
enabled = true
window_days = 60
min_rows = 50
warn_psi = 0.25

[production.intraday_pnl]
# Live marks and intraday P&L of the engine's books (roadmap 21.3.3): one
# intraday_snapshots row per portfolio and strategy sleeve every
# snapshot_minutes, read by GET /api/risk/intraday and the Live page.
enabled = false
snapshot_minutes = 5
stale_mark_seconds = 120          # a held name with an older mark counts as stale

[production.live]
# Live trading at a real broker (roadmap 19). Stonks trades only the
# positions it opened in a shared account.
allow_manual_trades = true
# Decide after the close, submit in the window before the next open
# (order tickets, roadmap 19.8). Off: auto books send at once. Books with
# an approve subscription, and runaway runs, always use tickets.
submit_in_window = false
# A short sale of a name the borrow source marks hard to borrow, or whose
# yearly borrow fee is at or above this fraction, waits for a person as a
# ticket, even in auto (roadmap 19.16).
hard_to_borrow_fee_rate = 0.03

[production.live.submit]
calendar = "XNYS"
window_minutes = 20                # the live_submit job fires at open minus this
deadline_minutes = 2               # unsent tickets expire at open minus this

[production.live.stages]
# Stage gates (roadmap 19.9). A promotion needs every check to pass, a
# fresh second factor and a typed confirmation. A dirty week only alerts.
min_paper_days = 20                # gate 1: paper days of every live subscription
min_broker_paper_sessions = 20     # gate 2: sessions in broker_paper
broker_paper_clean_sessions = 20   # gate 2: the last 4 weeks clean
min_live_small_sessions = 40       # gate 3: 8 weeks in live_small
live_small_clean_sessions = 30     # gate 3: the last 6 weeks clean
min_live_fills = 30                # gate 3: filled live orders
max_reject_rate = 0.02             # a clean session rejects under 2%
week_sessions = 5

[production.live.reconcile]
# The end-of-day check's cash and statement comparisons (roadmap 19.15).
compare_cash = true
cash_tolerance = 1.0               # currency units
cash_tolerance_fraction = 0.0001   # of net liquidation, the larger wins
cash_is_drift = false              # true: a cash difference halts buys
compare_statement = true           # IBKR Flex, when configured
commission_tolerance = 0.01

[production.options]
# Live options at IBKR (roadmap 17.8). Off. An option order opens only
# when this is true, the portfolio is at live_small or higher and its
# owner set an options approval level. Closes always go out. Needs the
# OPRA market data add-on at IBKR (docs/release-1.0.md).
live = false
collar_share = 0.0                 # limit at the mid (1.0: at the touch), never market
max_spread_pct = 0.5               # no order on a wider quote
auto_approve_closes = false        # every option order waits for a person
max_loss_per_group = 0.02          # of equity, when option_max_loss sets none
max_loss_total = 0.10

[production.options.expiry]
close_sessions = 1                 # close or roll on the session before expiry
action = "close"                   # or "roll" to the expiry nearest roll_target_days
roll_target_days = 35
close_longs = true
watch_band = 0.01                  # expiry-day alert for shorts in or near the money

[production.health]
# `stonks health` thresholds.
max_bar_age_days = 4
stuck_tick_minutes = 60
stuck_ingest_minutes = 180
ingest_failure_lookback_hours = 24
# Lab worker jobs queued this long with no live worker are unhealthy (14.9).
stuck_lab_queue_minutes = 30

[backtest.costs]
# Transaction costs for lab runs, backtests and simulated tick fills
# (BL-13: realistic by default, the values of CostModelSettings.realistic()).
# A run with all-zero costs logs a `zero_costs` warning; ask for it explicitly
# (`stonks lab run --cost-model zero`, API `cost_model: "zero"`).
# Square-root-law impact in bps of an order the size of the whole bar, capped.
impact_bps = 100.0
max_impact_bps = 500.0

[backtest.costs.default]
# Fallback for asset classes not listed under [backtest.costs.asset_classes.*].
fee_flat = 0.0
half_spread_bps = 2.0
fee_bps = 0.5

[backtest.costs.asset_classes.equity]
half_spread_bps = 2.0
fee_bps = 0.5
# Broker commission (roadmap 23.2): "none", "ibkr_fixed" or "ibkr_tiered".
# With an IBKR schedule set fee_bps = 0.0, the commission replaces it.
# commission = "ibkr_tiered"
# US regulatory fees: SEC fee and FINRA TAF on sales, CAT fee on both sides.
# us_sell_fees = true

[backtest.costs.asset_classes.crypto]
half_spread_bps = 5.0
fee_bps = 10.0

[backtest.costs.asset_classes.commodity]
half_spread_bps = 3.0
fee_flat = 1.0

[backtest.costs.asset_classes.bond]
half_spread_bps = 5.0
fee_bps = 1.0

# Rates of the commission schedules and regulatory fees. The values below are
# the defaults. Check them against the sources before trusting a figure.
# [backtest.costs.commissions.ibkr_fixed]
# per_share = 0.005        # IBKR Pro Fixed, interactivebrokers.com/en/pricing/commissions-stocks.php
# minimum = 1.00
# max_fraction = 0.01      # the cap, 1% of the trade value
# [backtest.costs.commissions.ibkr_tiered]
# monthly_shares = 0       # picks the volume tier (0.0035 per share up to 300,000)
# minimum = 0.35
# max_fraction = 0.01
# exchange_per_share = 0.003   # taking liquidity, Reg NMS cap
# clearing_per_share = 0.0002  # NSCC and DTC
# [backtest.costs.commissions.us_regulatory]
# sec_rate_per_million = 27.80  # SEC Section 31 fee rate advisory
# taf_per_share = 0.000166      # FINRA By-Laws Schedule A
# taf_max = 8.30
# cat_per_share = 0.000035      # CAT LLC fee schedule

[backtest.lots]
# Round order sizes to tradable lots in backtests, the lab, paper books and
# model books, all alike (roadmap 23.1, P21). "fractional" (the default, no
# rounding), "whole_shares" (whole stocks, bonds and commodities, fractional
# crypto, as at IBKR) or "whole". Live books always use their broker's rule.
profile = "fractional"
# The profile the minimum capital is measured against, and the share of
# opening orders that must buy at least one lot.
min_capital_profile = "whole_shares"
min_capital_quantile = 0.95
# Lot size per ticker where it is not one unit.
# [backtest.lots.lot_sizes]
# "7203.TSE" = 100

[backtest.execution]
# Cash-account settlement of sale proceeds in lab and API backtests, in
# business days (0 = available at once, 1 = T+1).
settlement_days = 0
# Uncomment for the bar-range fill model (BL-30): participation cap, limit and
# stop orders, gap guard. Absent = every order fills in full at the next open.
# [backtest.execution.fill]
# max_participation = 0.10         # largest share of the bar's volume per order
# participation_basis = "bar_volume"   # or "adv"
# carry_unfilled = true
# honour_limits = true
# max_gap_days = 7.0

# Run lab and API backtests through the production construction pipeline
# (omit: each strategy decides alone).
# [backtest.construction]
# method = "single_winner"

[lab]
# Benchmark every lab backtest, API backtest and tear sheet is compared
# against: "auto" (SPY.US when the lake prices it, else the equal-weight
# universe), "EW", a ticker such as "QQQ.US", or "none". `--benchmark` and the
# API's `benchmark` field override it.
benchmark = "auto"
# Trading bars skipped between the train and the validation window (BL-20):
# serially correlated features and labels can't leak across it. A strategy's
# label_horizon_bars raises it per run. `--embargo-bars` / `embargo_bars` override.
embargo_bars = 0
# Data preflight before tuning (BL-37): coverage, warm-up, quarantined bars,
# statement flags, survivorship. Errors stop the run, warnings ride on the
# result. `--no-preflight` / `--strict` and the API fields override these.
preflight = true
strict_preflight = false           # true: every warning is an error

[lab.walk_forward]
# Defaults for `stonks lab run --walk-forward` (CLI flags override).
n_splits = 4
# test_days = 30                   # omit: split the validation window evenly
# train_days = 120                 # omit: everything before the first test window
anchored = false
metric = "sharpe"
min_positive_share = 0.5
min_mean_score = 0.0
min_wfe = 0.5                      # walk-forward efficiency gate (OOS / IS return)
matrix = false                     # also run the train x test matrix (--wf-matrix)

[lab.parallel]
# Worker processes for tuning trials and `stonks lab sweep` (one spawn pool,
# lab/parallel.py). 0 = every core (capped at 32), 1 = in-process. Results do
# not depend on the worker count. `stonks lab run --workers N` overrides.
max_workers = 0
# BLAS/OpenMP threads per worker (the pool is the parallelism).
blas_threads = 1

[lab.offload]
# Where heavy lab jobs run (roadmap 14.9, docs/deploy.md). "in_process": in
# the API, as always. "worker": queued in the state DB for a separate lab
# worker (python -m stonks.lab.offload worker) that reads a read-only lake
# snapshot. Env: STONKS_LAB_EXECUTOR.
executor = "in_process"
kinds = ["lab_run", "lab_sweep", "studio_lab_run"]
# snapshot_dir = "data/lab_snapshots"   # omit: <lake dir>/lab_snapshots
snapshot_max_age_minutes = 60
keep_snapshots = 2
poll_seconds = 2
heartbeat_seconds = 10
lease_seconds = 120

[factors]
# Factor panel cache (roadmap 22.2, docs/factors.md). "parquet" keeps one file
# per panel across restarts, "memory" keeps panels in this process only, "off"
# computes every time. A panel is dropped as soon as the data it read changes.
cache = "parquet"
# cache_dir = "data/factor_panels"  # omit: factor_panels next to the lake file

[screener]
# Screens at scale (roadmap 20.11, docs/universes.md#screener). A screen whose
# rule keeps more than max_candidates fails with a message on how to narrow it.
# Above job_threshold candidates the console runs it as a background job.
# A result is reused for cache_seconds for the same spec and date (0: off).
max_candidates = 10000
job_threshold = 1000
cache_seconds = 300
cache_entries = 32

[streaming]
# Live price streams into 1m bars (roadmap 21.1, docs/design/intraday.md).
# Off by default. Run with `python -m stonks.streaming run`. The EODHD key
# comes from EODHD_API_KEY, never from here.
enabled = false
source = "eodhd"          # eodhd | ibkr | replay
tickers = []
calendar = "XNYS"         # when a silent stream counts as stale
bar_mode = "auto"         # auto | trades | quotes
stale_after_seconds = 60
backfill = true           # fill gaps from the REST intraday ingest
backfill_source = "eodhd"

[engine]
# The intraday engine process (roadmap 21.2.5, docs/design/intraday.md).
# Off by default: the engine_start and engine_stop jobs skip. Run it by hand
# with `python -m stonks.engine run` or replay a recording with `replay`.
# Books are listed as [[engine.books]] (id, portfolio_id, strategies,
# broker = "simulated" | "ibkr", initial_cash, sessions).
enabled = false
interval = "1m"
calendar = "XNYS"
universe = []                      # [] = [streaming].tickers
start_before_open_minutes = 15     # engine_start fires at open minus this
stop_after_close_minutes = 10      # engine_stop fires, and the process stops, at close plus this
stale_after_seconds = 180          # no new entries on a ticker with no bar for this long
stop_timeout_seconds = 60
[streaming.monitor]
# Engine monitoring (roadmap 21.3.4): stream and engine metrics on /metrics,
# the live panel, and the engine dead-man in the scheduler's watchdog.
deadman_minutes = 5          # alert when no bar close for this long in market hours
stale_after_seconds = 120    # an engine silent this long counts as down
publish_seconds = 15         # how often the engine writes its status

[audit]
# Statement audit tolerances (BL-36): relative gaps above which
# `stonks audit statements` (also run after `stonks ingest fundamentals`)
# flags a period. Flags land in the lake's statement_flags table.
balance = 0.02                     # assets vs liabilities + equity
net_income = 0.05                  # income statement vs cash flow
cash = 0.05                        # cash flow end cash vs balance sheet
gross_profit = 0.02                # vs revenue - cost of revenue
quarterly_sum = 0.05               # four quarters vs the annual figure

[ensure]
# On-demand bar fetches for universes (docs/universes.md): `stonks universe
# ensure`, `stonks lab run --ensure-data`, POST /api/universes/{id}/ensure and
# the daily universes_refresh job. Only the missing ranges are fetched.
max_workers = 8                    # concurrent fetches (network bound)
default_requests_per_second = 5.0
bulk = false                       # one bulk call per exchange and day (paid plans)
bulk_max_days = 5
bulk_min_tickers = 20
prefetch_window = 64               # fetches kept ahead of the writer
settle_days = 14                   # empty recent answers are asked again
overlap_bars = 5                   # stored bars re-read to notice new splits and dividends
adjustment_tolerance = 0.0005      # adj_close/close drift that triggers a full re-fetch

[ensure.requests_per_second]
eodhd = 10.0
yahoo = 2.0

[ensure.plans]
# Data plan per source. The EODHD free plan keeps one year of daily bars and
# has no intraday or bulk data, so windows are clipped with a warning.
eodhd = "free"

[notify]
# Backends: "log" (structlog), "webhook" (JSON POST), "store" (the state DB's
# alerts table, read by GET /api/alerts) and/or "outbox" (every active admin's
# feed and devices: Web Push, email, their own webhook). [] disables alerts.
# Halt trips and quit-rule alerts always go through the outbox channels.
backends = ["log", "store"]
# Drop notifications below this level: info | warning | error. "store" keeps
# every level.
min_level = "warning"

[notify.webhook]
# Set the URL via STONKS_NOTIFY_WEBHOOK_URL in .env; it usually embeds a token.
timeout_seconds = 5.0

[telegram]
# The Telegram bot (docs/operations.md). The token is env only
# (STONKS_TELEGRAM_BOT_TOKEN). With the token set, linked chats get
# notifications. enabled = true also answers commands (long polling inside
# `stonks serve`, no public webhook).
enabled = false
poll_timeout_seconds = 25
link_code_minutes = 10.0
kill_confirm_minutes = 2.0
# bot_username = "my_stonks_bot"   # shown next to a link code

[sources.eodhd]
base_url = "https://eodhd.com/api"
timeout_seconds = 30
max_retries = 3
retry_backoff_seconds = 1.0

[sources.yahoo]
timeout_seconds = 30
max_retries = 3
retry_backoff_seconds = 2.0
# Yahoo rate-limits aggressively; space consecutive requests out.
min_request_interval_seconds = 0.5

[sources.defillama]
# Free public API (no key); DeFi TVL per chain for `stonks ingest tvl`.
base_url = "https://api.llama.fi"
timeout_seconds = 30
max_retries = 3
retry_backoff_seconds = 1.0

[sources.ibkr_borrow]
# IBKR's public short stock files for `stonks ingest borrow` (roadmap 19.3).
# The login is IBKR's shared public one, not your account.
host = "ftp2.interactivebrokers.com"
user = "shortstock"
timeout_seconds = 30
markets = ["usa"]

[sources.edgar]
# SEC EDGAR filings for `stonks ingest edgar` (roadmap 23.13): Form 4
# insider trades, 8-K items and 13F holdings, free and keyless. The SEC
# asks every client to name itself with a contact address. Set it here or
# in STONKS_EDGAR_USER_AGENT, e.g. "Jane Trader jane@example.com".
user_agent = ""
min_request_interval_seconds = 0.125   # the SEC allows 10 requests a second
forms = ["8-K", "8-K/A", "10-Q", "10-K", "10-K/A"]

[brokers]
# Broker `stonks tick` (CLI and API) trades through. "simulated" (default)
# fills in memory against the last portfolio snapshot and needs no keys.
# "alpaca" is opt-in: the tick reconciles open orders, reads the portfolio
# from the Alpaca account, and books fills only through reconciliation.
# "ibkr" trades the default portfolio through the IB Gateway under
# [brokers.ibkr.gateways] that lists it (deploy/ibkr/README.md).
kind = "simulated"

[brokers.alpaca]
# Paper trading by default. Real money needs BOTH paper = false AND
# allow_live = true. Only read when kind = "alpaca". Keys are env-only
# (ALPACA_API_KEY / ALPACA_SECRET_KEY); api_key / secret_key here are rejected.
paper = true
allow_live = false
max_retries = 3
retry_backoff_seconds = 1.0

[api]
# REST API for `stonks serve`. Every call needs a credential: a browser
# session or a personal API token (see docs/security.md). The old shared
# STONKS_API_TOKEN is read from the environment only, never from this file.
# Bind address. Env: STONKS_API_HOST (Compose sets 0.0.0.0).
host = "127.0.0.1"
port = 8000
# The Angular dev server. The only origin CORS lets send cookies.
ui_origin = "http://localhost:4200"
# Reads from 127.0.0.1 without a credential. Off. STONKS_PROFILE=dev turns
# it on for local UI work.
open_reads_on_loopback = false
# Peers allowed to set X-Forwarded-For (IPs or networks). Compose sets
# STONKS_API_TRUSTED_PROXIES to its Docker network so Caddy's header counts.
trusted_proxies = ["127.0.0.1"]
# Host names the API answers besides loopback (400 for any other Host).
# Env: STONKS_API_ALLOWED_HOSTS, comma-separated; Compose sets STONKS_DOMAIN,api.
allowed_hosts = []
max_concurrent_jobs = 2
default_page_size = 50
max_page_size = 500
ui_dist = "web/dist"

[auth]
# Sign-in and sessions. Env overrides: STONKS_AUTH_<NAME>, e.g.
# STONKS_AUTH_COOKIE_SECURE=false. Secrets (STONKS_SECRET_KEYS) are env only.
cookie_secure = true              # browsers accept Secure cookies on http://localhost too
session_idle_hours = 12.0
session_absolute_days = 7.0
pending_login_minutes = 10.0      # time to enter the second factor after the password
step_up_minutes = 10.0            # sensitive actions need a second factor this recent
max_failures = 5                  # per account, per second factor and per IP
failure_window_minutes = 15.0
totp_issuer = "Stonks"

[golive]
# `stonks golive check <id>` limits for a paper-trading period (shadow P&L for
# shadow strategies, the real simulated portfolio for active ones). Missing
# data fails a check. The gate never promotes; `stonks registry promote` does.
min_days = 63                     # at least MinTRL of the oos Sharpe when incubation is on
max_drawdown = 0.15               # deepest allowed drawdown, positive fraction
max_drift = 0.10                  # max |paper return - backtest-expected return|
min_trades = 20
require_all_survival_passed = true
# Incubation grade (BL-25): adds within_mc_band, quit_rule, promotion_preset,
# nonzero_costs, hypothesis_recorded and backtest_min_trades. false keeps the
# six checks above.
incubation = true
use_min_trl = true                # min_days = max(min_days, MinTRL of the oos Sharpe)
min_trl_cap_days = 252
min_trl_alpha = 0.05              # the track record must reach PSR >= 1 - alpha
periods_per_year = 252            # de-annualises the oos Sharpe for MinTRL
quit_drawdown_multiple = 1.5      # quit beyond 1.5x the backtest drawdown (or MC p95)
promotion_preset = "promotion"    # every test of this preset needs a stored report
min_backtest_trades = 30
min_hypothesis_chars = 20

[lifecycle]
# Model lifecycle (roadmap 22.6, docs/model-lifecycle.md). The model_retrain
# job refits strategies that learn from data into candidate versions. A
# candidate runs as a model book beside the live version and swaps in only
# through `stonks registry swap`, after the swap check below passes.
lookback_days = 730               # each fit trains on this many calendar days
statuses = ["active", "shadow"]
min_days_between_fits = 5         # a newer fit is kept, not redone (unless forced)

[lifecycle.swap]
min_days = 20                     # candidate model book days before a swap
max_drawdown = 0.25
max_underperformance = 0.02       # the candidate may trail the live version by this much

[mcp]
# `stonks mcp` talks to the running REST API (`stonks serve`); it never opens
# the lake. Write and job tools send STONKS_API_TOKEN (env only).
api_url = "http://127.0.0.1:8000"
timeout_seconds = 30.0
max_wait_seconds = 600.0

[assistant]
# The in-app AI assistant (roadmap 20.4). Off until base_url names an
# OpenAI-compatible chat endpoint: Ollama "http://127.0.0.1:11434/v1", vLLM
# "http://127.0.0.1:8001/v1" or a llama.cpp server "http://127.0.0.1:8080/v1".
# An optional key comes from STONKS_ASSISTANT_API_KEY (env only).
# base_url = "http://127.0.0.1:11434/v1"
model = "llama3.1"
max_steps = 8                     # model calls per turn
max_tokens = 1024                 # tokens per model call
timeout_seconds = 120.0           # one turn, tool calls included
max_conversation_messages = 40    # recent messages sent to the model
max_tool_result_chars = 8000      # characters of each tool result fed back
temperature = 0.2

[assistant.envelope]
# Research only by default: no order tool at all. With order_tools = true the
# assistant may only draft orders, which you approve in the web app with a
# fresh second factor.
order_tools = false
# allowed_tickers = ["AAPL.US", "MSFT.US"]
max_order_notional = 5000.0
max_day_notional = 20000.0
price_band = 0.05                 # a limit within 5% of the latest close
draft_ttl_minutes = 1440.0
max_writes_per_minute = 5         # a burst freezes the assistant
max_writes_per_hour = 40
freeze_minutes = 60.0

[assistant.research]
# The AI research loop (roadmap 22.9): the assistant proposes hypotheses and
# runs lab trials under these budgets, each counted in the trial ledger. It
# never registers or promotes a strategy. Models remember prices from before
# their training cutoff, so a proposal's validation window must start after
# model_cutoff. Off until you set it for your model.
# model_cutoff = "2023-12-31"
max_trials = 200                  # tuning trials per session
max_proposals = 10                # proposals per session, rejected ones too
max_cpu_seconds = 3600.0          # lab wall time x lab workers per session
max_budget_per_proposal = 50      # tuning trials per proposal
survival_tests = ["oos", "deflated_sharpe", "pbo"]
min_hypothesis_chars = 40
min_premortem_chars = 20

[breadth]
# The market breadth card on Today (roadmap 23.14). Display only. Without a
# universe_id it measures every equity with daily bars in the lake.
# universe_id = "sp500"
index = "SPY.US"                  # distribution days are counted on it
min_history = 60                  # sessions before a stock counts for highs and lows
high_low_window = 252             # about one year
distribution_window = 25          # sessions
distribution_drop = 0.002         # an index fall of 0.2 % or more on higher volume
lookback_days = 400

# Estimated tax rates for the pre-trade tax preview and the tax owed this
# year (roadmap 23.5). A guide, not tax advice: set the rates that apply to
# you. short_term: held one year or less; long_term: held longer.
[tax.rates.us]
short_term = 0.32
long_term = 0.15

[tax.rates.eu]
short_term = 0.26
long_term = 0.26

[tax.rates.uk]
short_term = 0.24
long_term = 0.24

[assistant.grounding]
# Every number in a reply must appear in a tool result of that turn (roadmap
# 23.8). flag adds a note naming the numbers no tool showed. rewrite asks the
# model once to cite or drop them, then flags what is left. off: no check.
mode = "flag"
free_integers_upto = 3             # whole numbers up to this are not checked
ignore_years = true

[assistant.briefings]
# Research-only briefings before the open and after the close (roadmap
# 23.8), through the notification router and Telegram. Each person also
# turns them on. Read tools only, never a write.
enabled = false
