[lake]
path = "data/lake.duckdb"

# Bar store: "duckdb" (table in the lake file) or "parquet" (partitioned
# files under <lake dir>/bars, readable while `stonks serve` runs). Switch with
# `uv run python -m stonks.store.bars_migrate` (see docs/architecture.md).
[lake.bars]
backend = "duckdb"

[state]
path = "data/state.sqlite"

[registry]
artifacts_dir = "data/artifacts"

[logging]
level = "INFO"

[production]
# Universe the production tick iterates; empty means "explicitly pass --tickers".
universe = []
threshold = 0.0
initial_cash = 10000.0
slippage_bps = 0.0
fee_per_trade = 0.0
# Ignore closes older than this many calendar days before the tick's as_of.
max_price_staleness_days = 7
# Evaluate shadow strategies each tick against their own virtual portfolios
# (written to shadow_decisions / shadow_portfolio_snapshots; never traded).
shadow_enabled = true
# Fraction of each cash dividend withheld as tax in the tick and shadow
# books (0 = credited in full; e.g. 0.15 for a treaty withholding rate).
dividend_withholding_rate = 0.0
# Which strategies keep a model book each tick: "shadow" (shadow strategies
# only) or "all" non-retired strategies.
model_books = "shadow"
# true: trade one book per portfolio from its paper/auto subscriptions (and
# record notify-mode signals) instead of one book over every active strategy.
# When on, a newly promoted strategy trades only once a subscription includes
# it (e.g. subscribe pf_default to it).
books_from_subscriptions = false

[production.construction]
# Portfolio constructor for every book (a portfolio's construction_json is
# merged on top): single_winner (default: the best-ranked strategy decides),
# equal_weight_top_n, inverse_vol, vol_target, atr_parity. The buffer applies
# to the target-weight constructors only.
method = "single_winner"
buffer_fraction = 0.10
min_trade_weight = 0.005

[production.risk]
# Risk layer between strategy.decide and the broker. Sells are never blocked.
# Weights are fractions of portfolio value before the tick's orders.
enabled = true
# max_open_positions = 10          # omit for unlimited
max_weight_per_ticker = 1.0
cash_buffer_fraction = 0.0
min_order_notional = 0.0

[production.risk.max_weight_per_asset_class]
# crypto = 0.2                     # classes not listed are uncapped

# History-aware risk rules (BL-27), all off by default. Portfolio and
# subscription overrides can only tighten them. Examples:
# [production.risk.rules.max_holding]
# max_holding_bars = 60            # force-sell positions held 60+ bars
# [production.risk.rules.sector_cap]
# max_weight_per_sector = 0.3
# [production.risk.rules.liquidity]
# max_pct_adv = 0.05               # buys up to 5% of 20-day average volume
# [production.risk.rules.portfolio_vol]
# vol_cap = 0.20                   # scale buys down above 20% forecast vol
# [production.risk.rules.risk_per_position]
# max_risk = 0.01                  # k * ATR risk per position, fraction of equity
# [production.risk.rules.drawdown_scaling]
# schedule = [[0.10, 0.5], [0.20, 0.0]]   # size by drawdown from peak

[production.health]
# `stonks health` thresholds.
max_bar_age_days = 4
stuck_tick_minutes = 60
stuck_ingest_minutes = 180
ingest_failure_lookback_hours = 24

[backtest.costs]
# Transaction costs for lab runs, backtests and simulated tick fills
# (BL-13: realistic by default, the values of CostModelSettings.realistic()).
# A run with all-zero costs logs a `zero_costs` warning; ask for it explicitly
# (`stonks lab run --cost-model zero`, API `cost_model: "zero"`).
# Square-root-law impact in bps of an order the size of the whole bar, capped.
impact_bps = 100.0
max_impact_bps = 500.0

[backtest.costs.default]
# Fallback for asset classes not listed under [backtest.costs.asset_classes.*].
fee_flat = 0.0
half_spread_bps = 2.0
fee_bps = 0.5

[backtest.costs.asset_classes.equity]
half_spread_bps = 2.0
fee_bps = 0.5

[backtest.costs.asset_classes.crypto]
half_spread_bps = 5.0
fee_bps = 10.0

[backtest.costs.asset_classes.commodity]
half_spread_bps = 3.0
fee_flat = 1.0

[backtest.costs.asset_classes.bond]
half_spread_bps = 5.0
fee_bps = 1.0

[lab]
# Benchmark every lab backtest, API backtest and tear sheet is compared
# against: "auto" (SPY.US when the lake prices it, else the equal-weight
# universe), "EW", a ticker such as "QQQ.US", or "none". `--benchmark` and the
# API's `benchmark` field override it.
benchmark = "auto"
# Trading bars skipped between the train and the validation window (BL-20):
# serially correlated features and labels can't leak across it. A strategy's
# label_horizon_bars raises it per run. `--embargo-bars` / `embargo_bars` override.
embargo_bars = 0

[lab.walk_forward]
# Defaults for `stonks lab run --walk-forward` (CLI flags override).
n_splits = 4
# test_days = 30                   # omit: split the validation window evenly
# train_days = 120                 # omit: everything before the first test window
anchored = false
metric = "sharpe"
min_positive_share = 0.5
min_mean_score = 0.0
min_wfe = 0.5                      # walk-forward efficiency gate (OOS / IS return)
matrix = false                     # also run the train x test matrix (--wf-matrix)

[lab.parallel]
# Worker processes for tuning trials and `stonks lab sweep` (one spawn pool,
# lab/parallel.py). 0 = every core (capped at 32), 1 = in-process. Results do
# not depend on the worker count. `stonks lab run --workers N` overrides.
max_workers = 0
# BLAS/OpenMP threads per worker (the pool is the parallelism).
blas_threads = 1

[notify]
# Backends: "log" (structlog), "webhook" (JSON POST) and/or "store" (the
# state DB's alerts table, read by GET /api/alerts). [] disables alerts.
backends = ["log", "store"]
# Drop notifications below this level: info | warning | error. "store" keeps
# every level.
min_level = "warning"

[notify.webhook]
# Set the URL via STONKS_NOTIFY_WEBHOOK_URL in .env; it usually embeds a token.
timeout_seconds = 5.0

[sources.eodhd]
base_url = "https://eodhd.com/api"
timeout_seconds = 30
max_retries = 3
retry_backoff_seconds = 1.0

[sources.yahoo]
timeout_seconds = 30
max_retries = 3
retry_backoff_seconds = 2.0
# Yahoo rate-limits aggressively; space consecutive requests out.
min_request_interval_seconds = 0.5

[sources.defillama]
# Free public API (no key); DeFi TVL per chain for `stonks ingest tvl`.
base_url = "https://api.llama.fi"
timeout_seconds = 30
max_retries = 3
retry_backoff_seconds = 1.0

[brokers]
# Broker `stonks tick` (CLI and API) trades through. "simulated" (default)
# fills in memory against the last portfolio snapshot and needs no keys.
# "alpaca" is opt-in: the tick reconciles open orders, reads the portfolio
# from the Alpaca account, and books fills only through reconciliation.
kind = "simulated"

[brokers.alpaca]
# Paper trading by default. Real money needs BOTH paper = false AND
# allow_live = true. Only read when kind = "alpaca". Keys are env-only
# (ALPACA_API_KEY / ALPACA_SECRET_KEY); api_key / secret_key here are rejected.
paper = true
allow_live = false
max_retries = 3
retry_backoff_seconds = 1.0

[api]
# REST API for `stonks serve`. The bearer token is read from STONKS_API_TOKEN
# only (never from this file); mutating routes fail closed without it.
host = "127.0.0.1"
port = 8000
ui_origin = "http://localhost:4200"
open_reads_on_loopback = true
allowed_hosts = []
max_concurrent_jobs = 2
default_page_size = 50
max_page_size = 500
ui_dist = "web/dist"

[golive]
# `stonks golive check <id>` limits for a paper-trading period (shadow P&L for
# shadow strategies, the real simulated portfolio for active ones). Missing
# data fails a check. The gate never promotes; `stonks registry promote` does.
min_days = 63                     # at least MinTRL of the oos Sharpe when incubation is on
max_drawdown = 0.15               # deepest allowed drawdown, positive fraction
max_drift = 0.10                  # max |paper return - backtest-expected return|
min_trades = 20
require_all_survival_passed = true
# Incubation grade (BL-25): adds within_mc_band, quit_rule, promotion_preset,
# nonzero_costs, hypothesis_recorded and backtest_min_trades. false keeps the
# six checks above.
incubation = true
use_min_trl = true                # min_days = max(min_days, MinTRL of the oos Sharpe)
min_trl_cap_days = 252
min_trl_alpha = 0.05              # the track record must reach PSR >= 1 - alpha
periods_per_year = 252            # de-annualises the oos Sharpe for MinTRL
quit_drawdown_multiple = 1.5      # quit beyond 1.5x the backtest drawdown (or MC p95)
promotion_preset = "promotion"    # every test of this preset needs a stored report
min_backtest_trades = 30
min_hypothesis_chars = 20

[mcp]
# `stonks mcp` talks to the running REST API (`stonks serve`); it never opens
# the lake. Write and job tools send STONKS_API_TOKEN (env only).
api_url = "http://127.0.0.1:8000"
timeout_seconds = 30.0
max_wait_seconds = 600.0
