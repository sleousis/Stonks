# git-cliff configuration (Phase 12.9): CHANGELOG.md and release notes come
# from commit subjects. Commits here start with an imperative verb ("Add ...",
# "Fix ..."), not Conventional Commits, so the verb picks the section.
#
#   git cliff -o CHANGELOG.md                 # whole history
#   git cliff --tag v1.2.3 -o CHANGELOG.md    # before tagging v1.2.3
#   git cliff --latest --strip header         # notes for the newest tag (CI)

[changelog]
header = """
# Changelog

All notable changes to Stonks. Generated from commit messages by
[git-cliff](https://git-cliff.org) with `cliff.toml`; do not edit by hand.
Versions follow [Semantic Versioning](https://semver.org).\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
topo_order = false
sort_commits = "newest"

# First matching parser wins. The HTML comments only order the sections.
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^(Regenerate|Sync) ", skip = true },
  { message = "^(Add|Introduce|Implement|Expose|Support|Create) ", group = "<!-- 0 -->Added" },
  { message = "^(Fix|Correct|Repair|Handle|Guard|Prevent) ", group = "<!-- 2 -->Fixed" },
  { message = "^(Remove|Drop|Delete|Deprecate) ", group = "<!-- 3 -->Removed" },
  { message = "^(Harden|Scrub|Redact|Secure|Sanitize) ", group = "<!-- 4 -->Security" },
  { message = "^(Bump|Pin|Upgrade) ", group = "<!-- 5 -->Dependencies" },
  { message = "^(Document|Docs|Record|Roadmap|Plan|Describe|Explain|Write) ", group = "<!-- 6 -->Documentation" },
  { message = "^(Test|Cover) ", group = "<!-- 7 -->Tests" },
  { message = ".*", group = "<!-- 1 -->Changed" },
]
