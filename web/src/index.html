<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stonks</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e141b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply a forced theme before first paint (ThemeService owns it after boot).
      try {
        var t = localStorage.getItem('stonks.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
