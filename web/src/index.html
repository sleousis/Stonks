<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stonks</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#16222e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e161e" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Stonks trader console" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stonks" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply a forced theme before first paint (ThemeService owns it after boot).
      try {
        var t = localStorage.getItem('stonks.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>The Stonks console needs JavaScript. Turn it on and reload.</noscript>
  </body>
</html>
