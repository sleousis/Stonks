<a class="skip-link" href="#main">Skip to content</a>

@if (bare()) {
  <main id="main" class="bare" tabindex="-1">
    <router-outlet />
  </main>
} @else {
  <header class="chrome" [attr.data-tone]="halts.killOn() ? 'kill' : null">
    <div class="chrome-bar">
      <a routerLink="/" class="chrome-brand" aria-label="Stonks, Today">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 16 16">
            <path d="M2 11.5 6 7.5l3 3 5-6" />
            <path d="M10.5 4.5H14V8" />
          </svg>
        </span>
        <span class="wordmark" aria-hidden="true">Stonks</span>
      </a>
      <app-workspace-menu />
      <app-workspace-tabs />
      <span class="chrome-spacer"></span>
      <button
        type="button"
        class="chrome-control chrome-search"
        aria-haspopup="dialog"
        aria-keyshortcuts="Control+K Meta+K /"
        (click)="openPalette()"
      >
        <svg
          viewBox="0 0 16 16"
          width="15"
          height="15"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          aria-hidden="true"
        >
          <circle cx="7" cy="7" r="4.5" />
          <path d="m10.5 10.5 3 3" stroke-linecap="round" />
        </svg>
        <span class="search-label">Search or jump to</span>
        <kbd aria-hidden="true">{{ modKey }} K</kbd>
      </button>
      @if (session.me()) {
        <app-notification-bell />
      }
      <button
        type="button"
        class="chrome-icon"
        [attr.aria-label]="
          theme.resolved() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
        "
        (click)="theme.toggle()"
      >
        <svg
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <circle cx="8" cy="8" r="5.5" />
          <path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor" />
        </svg>
      </button>
      <app-account-menu (signOut)="signOut()" />
    </div>
    <!-- ops: the session rail with the halt state -->
    <app-session-strip />
  </header>

  <main id="main" #main tabindex="-1">
    @if (connectivity.online()) {
      <router-outlet />
    } @else {
      <app-offline-page />
    }
  </main>

  <app-bottom-nav />
}

<!-- Loaded on first use (UX-44): the first Ctrl+K, ?, or step-up request brings them in. -->
@defer (when shortcuts.paletteOpen()) {
  <app-command-palette />
}
@defer (when shortcuts.helpOpen()) {
  <app-shortcut-help />
}
<app-confirm-dialog />
@defer (when !!stepUp.request()) {
  <app-step-up-dialog />
}
<app-toast-outlet />
