<a class="skip-link" href="#main">Skip to content</a>

@if (bare()) {
  <main id="main" class="bare" tabindex="-1">
    <router-outlet />
  </main>
} @else {
  <header class="topbar">
    <button
      type="button"
      class="btn btn-ghost btn-icon"
      aria-label="Open navigation"
      aria-controls="nav-drawer"
      [attr.aria-expanded]="drawerOpen()"
      (click)="openDrawer()"
    >
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
        <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" />
      </svg>
    </button>
    <a routerLink="/" class="brand">Stonks</a>
    <span class="topbar-actions">
      <button
        type="button"
        class="btn btn-ghost btn-icon"
        aria-label="Search"
        aria-haspopup="dialog"
        aria-keyshortcuts="Control+K Meta+K /"
        (click)="openPalette()"
      >
        <ng-container *ngTemplateOutlet="searchIcon" />
      </button>
      <button
        type="button"
        class="btn btn-ghost btn-icon"
        [attr.aria-label]="
          theme.resolved() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
        "
        (click)="theme.toggle()"
      >
        <ng-container *ngTemplateOutlet="themeIcon" />
      </button>
    </span>
  </header>

  <div class="frame">
    <aside class="sidebar">
      <a routerLink="/" class="brand">Stonks</a>
      <button
        type="button"
        class="search-button"
        aria-haspopup="dialog"
        aria-keyshortcuts="Control+K Meta+K /"
        (click)="openPalette()"
      >
        <ng-container *ngTemplateOutlet="searchIcon" />
        <span class="search-label">Search</span>
        <kbd aria-hidden="true">{{ modKey }} K</kbd>
      </button>
      <app-nav />
      <ng-container *ngTemplateOutlet="footer" />
    </aside>

    <main id="main" #main tabindex="-1">
      <!-- ops: session strip with the halt state -->
      <app-session-strip />
      @if (connectivity.online()) {
        <router-outlet />
      } @else {
        <app-offline-page />
      }
    </main>
  </div>
}

<!-- Backdrop click closes the drawer; Escape (native dialog) and the close button cover keyboards. -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog
  #drawer
  id="nav-drawer"
  class="drawer"
  aria-label="Navigation"
  (close)="drawerOpen.set(false)"
  (click)="onDrawerClick($event)"
>
  <div class="drawer-body">
    <div class="drawer-head">
      <span class="brand">Stonks</span>
      <button
        type="button"
        class="btn btn-ghost btn-icon"
        aria-label="Close navigation"
        (click)="closeDrawer()"
      >
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" />
        </svg>
      </button>
    </div>
    <app-nav (navigate)="closeDrawer()" />
    <ng-container *ngTemplateOutlet="footer" />
  </div>
</dialog>

<ng-template #footer>
  <div class="sidebar-foot">
    @if (session.me(); as me) {
      <a routerLink="/profile" class="token-status set">
        <span class="dot" aria-hidden="true"></span>
        {{ me.display_name }}{{ me.via === 'session' ? '' : ', API token' }}
      </a>
      <button type="button" class="btn btn-ghost theme-toggle" (click)="signOut()">Sign out</button>
    } @else {
      <a routerLink="/login" class="token-status">
        <span class="dot" aria-hidden="true"></span>
        Read-only. Sign in
      </a>
    }
    <button type="button" class="btn btn-ghost theme-toggle" (click)="theme.toggle()">
      <ng-container *ngTemplateOutlet="themeIcon" />
      {{ theme.resolved() === 'dark' ? 'Light theme' : 'Dark theme' }}
    </button>
  </div>
</ng-template>

<ng-template #searchIcon>
  <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
    <circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.7" />
    <path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
  </svg>
</ng-template>

<ng-template #themeIcon>
  @if (theme.resolved() === 'dark') {
    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
      <circle cx="10" cy="10" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6" />
      <path
        d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"
        stroke="currentColor"
        stroke-width="1.6"
      />
    </svg>
  } @else {
    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
      <path
        d="M16 12.5A6.5 6.5 0 0 1 7.5 4a6.5 6.5 0 1 0 8.5 8.5z"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
      />
    </svg>
  }
</ng-template>

<app-command-palette />
<app-shortcut-help />
<app-confirm-dialog />
<app-step-up-dialog />
<app-toast-outlet />
