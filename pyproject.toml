[project]
name = "stonks"
version = "0.1.0"
description = "End-to-end equity research and trading system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.32",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "typer>=0.13",
    "python-dotenv>=1.0",
    "yfinance>=1.7.0",
    "alpaca-py>=0.44.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "mcp>=2.2.0",
    "httpx2>=2.13.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.14",
    "cryptography>=50.0.1",
    "exchange-calendars>=4.13.2",
    "filelock>=4.0.3",
    "pywebpush>=2.5.0",
    "argon2-cffi>=25.1.0",
    "pyotp>=2.10.0",
    "cvxpy>=1.9.3",
]

[project.scripts]
stonks = "stonks.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stonks"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-socket>=0.8.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --allow-hosts: sockets may only connect to loopback (TT-05, pytest-socket).
# Tests marked live get the network back (tests/conftest.py).
addopts = "-ra --strict-markers --allow-hosts=127.0.0.1,::1,localhost"
markers = [
    "live: tests that hit real external APIs (gated by STONKS_RUN_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pyright]
# TT-02: basic mode over src/stonks. CI fails only on errors that are not in
# tools/pyright-baseline.json (see tools/pyright_gate.py). Plan: strict mode
# for core, production, execution, auth and portfolio (docs/roadmap.md 18.3).
include = ["src/stonks"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
# TT-01: line and branch coverage of the package. pytest-cov combines the
# xdist workers.
branch = true
source = ["stonks"]

[tool.coverage.report]
# The gate is coverage.py's combined line-and-branch number. Target 90
# overall (measured 94 on 2026-09-26). The five strict packages have their
# own floors (target 95) in tools/coverage_gate.py.
fail_under = 90
skip_covered = true
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
    "if __name__ == .__main__.:",
]
