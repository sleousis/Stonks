[project]
name = "stonks"
version = "0.1.0"
description = "End-to-end equity research and trading system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.32",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "typer>=0.13",
    "python-dotenv>=1.0",
    "yfinance>=1.7.0",
    "alpaca-py>=0.44.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "mcp>=2.2.0",
    "httpx2>=2.13.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
stonks = "stonks.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stonks"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: tests that hit real external APIs (gated by STONKS_RUN_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
