[project]
name = "stonks"
version = "0.1.0"
description = "End-to-end equity research and trading system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.32",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "typer>=0.13",
    "python-dotenv>=1.0",
    "yfinance>=1.7.0",
    "alpaca-py>=0.44.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "mcp>=2.2.0",
    "httpx2>=2.13.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.14",
    "cryptography>=50.0.1",
    "exchange-calendars>=4.13.2",
    "filelock>=4.0.3",
    "pywebpush>=2.5.0",
    "argon2-cffi>=25.1.0",
    "pyotp>=2.10.0",
    "cvxpy>=1.9.3",
    "statsmodels>=0.15.0",
    "arch>=8.0.0",
    "optuna>=5.0.0",
]

[project.scripts]
stonks = "stonks.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stonks"]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "httpx2>=2.13.1",
    "hypothesis>=6.168.1",
    "pyright>=1.1.414",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-playwright>=0.9.0",
    "pytest-socket>=0.8.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --allow-hosts: sockets may only connect to loopback (TT-05, pytest-socket).
# Tests marked live get the network back (tests/conftest.py).
addopts = "-ra --strict-markers --allow-hosts=127.0.0.1,::1,localhost"
markers = [
    "live: tests that hit real external APIs (gated by STONKS_RUN_LIVE_TESTS=1)",
    "e2e: browser journeys over a seeded stack (opt in with -m e2e; see docs/testing.md)",
    "soak: the long paper soak over simulated weeks (opt in with -m soak; see docs/testing.md)",
    "slow: runs by default but takes seconds; skip with -m 'not slow' for a quick loop",
]
# TT-14: a leaked SQLite connection fails the run. The warning surfaces when
# the connection is garbage collected, as an unraisable exception.
filterwarnings = [
    "error:unclosed database:ResourceWarning",
    "error:Exception ignored in. <sqlite3.Connection:pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# TT-08 widened the set with DTZ, RUF, PT, PIE, PGH, PLE, ASYNC, LOG, T20,
# PERF, FLY and G. Every ignore below says why.
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET",
    "DTZ", "RUF", "PT", "PIE", "PGH", "PLE", "ASYNC", "LOG", "T20", "PERF", "FLY", "G",
]
ignore = [
    "E501",    # line length is the formatter's job
    "DTZ001",  # the lake stores naive UTC timestamps by design (bars.timestamp has no zone)
    "DTZ007",  # same: strptime of vendor dates that are UTC by contract
    "PT011",   # broad pytest.raises: 143 existing uses, burned down file by file
    "PT018",   # composite asserts read fine in tests
    "RUF001",  # the docs and messages use symbols such as x, >= and dashes on purpose
    "RUF002",  # same, in docstrings
    "RUF003",  # same, in comments
    "RUF005",  # style only: list concatenation is as clear as unpacking here
    "RUF007",  # style only: zip(a, a[1:]) is as clear as pairwise
    "RUF046",  # style only: int() around round() documents the intent
    "PERF401", # style only: explicit loops are clearer than extend() in these spots
    "FLY002",  # style only
    "G004",    # f-strings in the few stdlib logging calls; structlog is the norm
]

[tool.ruff.lint.isort]
known-first-party = ["stonks", "tests", "tools"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B011",    # assert False is fine in tests
    "RUF059",  # unused names from tuple unpacking document the shape
    "RUF012",  # fake classes keep mutable class-level records on purpose
    "PT012",   # rollback tests raise inside a multi-statement block on purpose
]
# Command-line entry points and dev tools print to stdout.
"src/stonks/**/__main__.py" = ["T201"]
"src/stonks/api/docs.py" = ["T201"]
"src/stonks/api/openapi.py" = ["T201"]
"src/stonks/mcp/docs.py" = ["T201"]
"src/stonks/store/bars_migrate.py" = ["T201"]
"src/stonks/lab/signal_eval.py" = ["T201"]
"tools/*" = ["T201"]
# date.today() is the local date, not UTC. These files belong to the 18.2
# data and universes fix waves, which move them to a UTC clock.
"src/stonks/app/universes.py" = ["DTZ011"]
"src/stonks/connections/providers/snaptrade.py" = ["DTZ011"]
"src/stonks/ingest/sources/eodhd.py" = ["DTZ011"]
"src/stonks/universes/index_sources/wikipedia_sp500.py" = ["DTZ011"]
"src/stonks/universes/providers/index.py" = ["DTZ011"]
"src/stonks/universes/refresh.py" = ["DTZ011"]

[tool.pyright]
# TT-02: basic mode over src/stonks. CI fails only on errors that are not in
# tools/pyright-baseline.json (see tools/pyright_gate.py). Plan: strict mode
# for core, production, execution, auth and portfolio (docs/roadmap.md 18.3).
# Packages listed in ``strict`` are checked in strict mode and may carry no
# baseline errors at all (the gate refuses them).
include = ["src/stonks"]
strict = ["src/stonks/core", "src/stonks/execution"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
# Analyse as Linux everywhere, so a Windows dev box and CI agree on the
# baseline.
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
# TT-01: line and branch coverage of the package. pytest-cov combines the
# xdist workers.
branch = true
source = ["stonks"]

[tool.coverage.report]
# The gate is coverage.py's combined line-and-branch number. Target 90
# overall (measured 93.6 on 2026-09-26). The five strict packages have their
# own floors (target 95) in tools/coverage_gate.py.
fail_under = 90
skip_covered = true
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
    "if __name__ == .__main__.:",
]
